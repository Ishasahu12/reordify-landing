function CountUp({ value, prefix = '', suffix = '', duration = 1200 }) {
const [count, setCount] = useState(0);
useEffect(() => {
const startTime = performance.now();
let frame;
const tick = (now) => {
const progress = Math.min((now - startTime) / duration, 1);
const eased = 1 - Math.pow(1 - progress, 3);
setCount(Math.round(value * eased));
if (progress < 1) frame = requestAnimationFrame(tick);
};
frame = requestAnimationFrame(tick);
return () => cancelAnimationFrame(frame);
}, [value, duration]);
return <span className="count-up">{prefix}{count.toLocaleString('en-US')}{suffix}</span>;
}

function Toast({ message, show, onClose }) {

function App() {
const [view, setView] = useState('home');
const [mode, setMode] = useState(TWEAK_DEFAULTS.decisionMode);
const [openFaq, setOpenFaq] = useState(0);
const [modal, setModal] = useState(null);
const [toast, setToast] = useState('');
const [showToast, setShowToast] = useState(false);
const [copied, setCopied] = useState(false);
const triggerToast = (message) => {
setToast(message);
setShowToast(true);
window.setTimeout(() => setShowToast(false), 2500);
};
useEffect(() => {
const onKey = (e) => { if (e.key === 'Escape') setModal(null); };
window.addEventListener('keydown', onKey);
return () => window.removeEventListener('keydown', onKey);
}, []);
useEffect(() => {
const els = document.querySelectorAll('.reveal');
const io = new IntersectionObserver((entries) => {
entries.forEach((entry) => {
if (entry.isIntersecting) entry.target.classList.add('visible');
});
}, { threshold: 0.14 });
els.forEach((el) => io.observe(el));
return () => io.disconnect();
}, [view]);
useEffect(() => {
const onScroll = () => {
const scrollable = document.documentElement.scrollHeight - window.innerHeight;
const progress = scrollable > 0 ? window.scrollY / scrollable : 0;
const progressBar = document.getElementById('scrollProgress');
const activeFlow = document.getElementById('activeFlow');
if (progressBar) progressBar.style.transform = `scaleX(${Math.min(progress, 1)})`;
if (activeFlow) activeFlow.style.strokeDashoffset = String(9000 - progress * 7200);
};
onScroll();
window.addEventListener('scroll', onScroll, { passive: true });
return () => window.removeEventListener('scroll', onScroll);
}, [view]);
const onCopy = async () => {
try {
if (navigator.clipboard) await navigator.clipboard.writeText('REO-DEC-2841');
} catch (e) {}
setCopied(true);
window.setTimeout(() => setCopied(false), 1200);
};
const handleCta = (type) => {
if (type === 'demo') setModal('demo');
else if (type === 'trial' || type === 'free' || type === 'pro') setModal('trial');
else triggerToast('Action queued for review');
};
return (
<div className="relative min-h-screen">
<FlowLine />
<Nav current={view} onNavigate={setView} onCta={handleCta} />
<main>
<div className="mx-auto max-w-[1600px]">
{view === 'home' ? (
<>
<Hero onCta={handleCta} />
<ProblemSection />
<ShiftSection />
<WalkthroughSection onCta={handleCta} copied={copied} onCopy={onCopy} />
<ImpactSection />
<TrustSection />
<FinalCTA onCta={handleCta} />
</>
) : (
<>
<ProductViewSection mode={mode} setMode={setMode} onCta={handleCta} />
<PricingSection openFaq={openFaq} setOpenFaq={setOpenFaq} onCta={handleCta} />
<FinalCTA onCta={handleCta} />
</>
)}
</div>
</main>
<Footer />
<DemoModal open={modal !== null} onClose={() => setModal(null)} type={modal} triggerToast={triggerToast} />
<Toast message={toast} show={showToast} onClose={() => setShowToast(false)} />
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
    </body>
  </html>
